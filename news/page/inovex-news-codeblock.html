ي مارس 2027.","title_ur":"الیمامہ اسٹیل نے 380 کے وی ٹاورز کے لیے 254 ملین ریال کے معاہدے کیے","summary_ur":"الیمامہ اسٹیل انڈسٹریز نے الجہاز کنٹریکٹنگ کے ساتھ 118.6 ملین اور 135.7 ملین ریال کے دو معاہدے کیے ہیں، جن کے تحت 380 کے وی ٹرانسمیشن لائنوں کے لیے اسٹیل ٹاورز فراہم کیے جائیں گے؛ ترسیل مارچ 2027 سے شروع ہوگی۔","title_zh":"Al Yamamah钢铁签署2.54亿里亚尔380千伏铁塔供货合同","summary_zh":"Al Yamamah钢铁工业公司与Algihaz承包公司签署两份合同，金额分别为1.186亿和1.357亿沙特里亚尔，为380千伏输电线路供应钢铁塔，计划于2027年3月开始交货。","source":"SMM (Shanghai Metals Market)","url":"https://news.metal.com/newscontent/104157329-al-yamamah-steel-secures-sar-25428m-in-contracts-for-380-kv-transmission-line-towers-in-saudi-arabia"},{"id":"ksa-industrial-licenses-july-2026-10","date":"2026-10-14","brand":"industry","region":"KSA","title":"Saudi Arabia issues 438 industrial licences in July as 189 factories start output","summary":"Ministry of Industry figures for July 2026 show 438 new industrial licences worth about SAR 4.82 billion, while 189 factories began production with SAR 1.95 billion invested — a growing base of plants that need finishing and coating capacity.","title_ar":"السعودية تصدر 438 ترخيصًا صناعيًا في يوليو وبدء الإنتاج في 189 مصنعًا","summary_ar":"تُظهر بيانات وزارة الصناعة لشهر يوليو 2026 إصدار 438 ترخيصًا صناعيًا جديدًا باستثمارات تقارب 4.82 مليار ريال، فيما بدأ 189 مصنعًا الإنتاج باستثمارات بلغت 1.95 مليار ريال، ما يوسّع قاعدة المصانع التي تحتاج إلى قدرات التشطيب والطلاء.","title_ur":"سعودی عرب نے جولائی میں 438 صنعتی لائسنس جاری کیے، 189 فیکٹریوں میں پیداوار شروع","summary_ur":"وزارتِ صنعت کے جولائی 2026 کے اعداد و شمار کے مطابق تقریباً 4.82 ارب ریال مالیت کے 438 نئے صنعتی لائسنس جاری ہوئے، جبکہ 1.95 ارب ریال کی سرمایہ کاری سے 189 فیکٹریوں نے پیداوار شروع کی، جس سے فنشنگ اور کوٹنگ کی ضرورت رکھنے والے پلانٹس کی تعداد بڑھ رہی ہے۔","title_zh":"沙特7月发放438张工业许可证，189家工厂投产","summary_zh":"沙特工业部2026年7月数据显示，新发放工业许可证438张，涉及投资约48.2亿里亚尔；另有189家工厂投产，投资19.5亿里亚尔，需要表面处理和涂装能力的工厂基数持续扩大。","source":"Ajel English","url":"https://english.ajel.sa/business/wtqp27kt3"},{"id":"hadeed-ceo-worldsteel-chair-2026-10","date":"2026-10-13","brand":"industry","region":"KSA","title":"Hadeed CEO Abdulqader Almubarak elected worldsteel chairman for 2026/27","summary":"The World Steel Association named the head of Saudi steelmaker Hadeed as its chairman for the 2026/2027 term, while EMSTEEL's CEO will chair the audit committee.","title_ar":"انتخاب الرئيس التنفيذي لحديد عبدالقادر المبارك رئيساً لـworldsteel لدورة 2026/2027","summary_ar":"أعلنت الرابطة العالمية للصلب تعيين الرئيس التنفيذي لشركة حديد السعودية رئيساً لمجلسها التنفيذي لدورة 2026/2027، فيما يتولى الرئيس التنفيذي لمجموعة EMSTEEL رئاسة لجنة التدقيق.","title_ur":"حدید کے سی ای او عبدالقادر المبارک 2026/27 کے لیے worldsteel کے چیئرمین منتخب","summary_ur":"ورلڈ اسٹیل ایسوسی ایشن نے سعودی اسٹیل ساز کمپنی حدید کے سربراہ کو 2026/2027 کی مدت کے لیے چیئرمین مقرر کیا، جبکہ EMSTEEL کے سی ای او آڈٹ کمیٹی کی صدارت کریں گے۔","title_zh":"Hadeed首席执行官Abdulqader Almubarak当选2026/27年度世界钢铁协会主席","summary_zh":"世界钢铁协会任命沙特钢铁企业Hadeed负责人为2026/2027任期主席，EMSTEEL集团首席执行官将出任审计委员会主席。","source":"SteelOrbis","url":"https://www.steelorbis.com/steel-news/latest-news/worldsteel-elects-hadeeds-almubarak-as-chairman-welcomes-five-new-members-1483340.htm"},{"id":"saudi-steel-pipe-aramco-2026-10","date":"2026-10-13","brand":"industry","region":"KSA","title":"Saudi Steel Pipe wins SAR 177m Aramco order for oil and gas pipes","summary":"Saudi Steel Pipe Company will supply oil and gas steel pipes to Saudi Aramco under a SAR 177 million contract to be delivered within a year, with the financial impact expected in the second half of 2027.","title_ar":"الشركة السعودية لأنابيب الصلب تفوز بطلب من أرامكو بقيمة 177 مليون ريال لأنابيب النفط والغاز","summary_ar":"ستورّد الشركة السعودية لأنابيب الصلب أنابيب فولاذية للنفط والغاز إلى أرامكو السعودية بموجب عقد قيمته 177 مليون ريال يُنفَّذ خلال عام واحد، ويُتوقع ظهور أثره المالي في النصف الثاني من 2027.","title_ur":"سعودی اسٹیل پائپ نے تیل و گیس پائپوں کے لیے آرامکو
