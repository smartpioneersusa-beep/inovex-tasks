<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>INOVEX Task Manager</title>
<meta name="description" content="INOVEX management team task manager.">
<meta name="theme-color" content="#121212">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="INOVEX Tasks">
<style>
  html,body{margin:0;height:100%;background:#121212;color:#ECEDEF;font:14px/1.5 'Segoe UI',Roboto,Arial,sans-serif}
  body{display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
  img{width:92px;height:92px;border-radius:20px}
  .spin{width:26px;height:26px;border:3px solid #2A2D31;border-top-color:#C9A227;border-radius:50%;animation:sp .9s linear infinite;margin:18px auto 10px}
  @keyframes sp{to{transform:rotate(360deg)}}
  #help{display:none;margin-top:14px;font-size:13px;color:#A3A8B0;max-width:340px}
  .btn{display:inline-block;margin-top:10px;padding:10px 18px;border-radius:8px;background:#C9A227;color:#121212;font-weight:600;text-decoration:none;border:0;font-size:14px;cursor:pointer}
  @media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
<div>
  <img src="./icons/icon-192.png" alt="INOVEX">
  <div class="spin" aria-hidden="true"></div>
  <div id="msg">Opening INOVEX Task Manager…</div>
  <div id="help">
    <span id="why"></span><br>
    <a class="btn" id="go" href="#">Open INOVEX Task Manager</a>
  </div>
</div>
<script src="./config.js"></script>
<script>
(function () {
  // The portal opens directly in this window (no frame), so Google sign-in works like in the browser.
  var APP = window.TM_CONFIG.appUrl;
  var ar = false; try { ar = (JSON.parse(localStorage.getItem('inovex-tm:lang')) || (/^ar/i.test(navigator.language) ? 'ar' : 'en')) === 'ar'; } catch (e) {}
  if (ar) { document.documentElement.lang = 'ar'; document.documentElement.dir = 'rtl'; document.getElementById('msg').textContent = 'جارٍ فتح مدير مهام إينوفكس…'; document.getElementById('go').textContent = 'افتح مدير مهام إينوفكس'; }
  var go = document.getElementById('go'); go.href = APP;
  function open() { location.replace(APP); }
  function help(text) { document.getElementById('why').textContent = text; document.getElementById('help').style.display = 'block'; }
  if (navigator.onLine === false) {
    help(ar ? 'لا يوجد اتصال بالإنترنت. اتصل ثم اضغط الزر.' : 'You are offline. Connect to the internet, then tap the button.');
    window.addEventListener('online', open);
  } else {
    open();
    setTimeout(function () { help(ar ? 'إذا لم تفتح الصفحة، اضغط الزر.' : 'If nothing opens, tap the button.'); }, 6000);
  }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(function () {});
})();
</script>
</body>
</html>
