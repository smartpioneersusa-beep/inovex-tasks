<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>INOVEX Task Manager</title>
<meta name="description" content="INOVEX management team task manager.">
<meta name="theme-color" content="#121212">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="INOVEX Tasks">
<style>
  html,body{margin:0;height:100%;background:#121212;color:#ECEDEF;font:14px/1.5 'Segoe UI',Roboto,Arial,sans-serif}
  body{display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
  img{width:92px;height:92px;border-radius:20px}
  .spin{width:26px;height:26px;border:3px solid #2A2D31;border-top-color:#C9A227;border-radius:50%;animation:sp .9s linear infinite;margin:18px auto 10px}
  @keyframes sp{to{transform:rotate(360deg)}}
  #help{display:none;margin-top:14px;font-size:13px;color:#A3A8B0;max-width:340px}
  .btn{display:inline-block;margin-top:10px;padding:10px 18px;border-radius:8px;background:#C9A227;color:#121212;font-weight:600;text-decoration:none;border:0;font-size:14px;cursor:pointer}
  h1{font-size:18px;margin:18px 0 12px}.wide{display:block;width:100%;max-width:340px;margin:10px auto 0}.ghost{background:transparent;color:#ECEDEF;border:1px solid #3A3E44}.small{font-size:12.5px;color:#A3A8B0;margin-top:12px}.small a{color:#C9A227}[hidden]{display:none!important}
  @media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
<div>
  <img src="./icons/icon-192.png" alt="INOVEX">
  <div id="wait"><div class="spin" aria-hidden="true"></div><div id="msg">Opening INOVEX Task Manager…</div></div>
  <div id="choose" hidden>
    <h1 id="q">How do you sign in?</h1>
    <button class="btn wide" id="staff" type="button">INOVEX staff (@inovex-group.com)</button>
    <button class="btn wide ghost" id="guest" type="button">Invited — I sign in with an email code</button>
    <p class="small" id="later">The app remembers your choice. To change it, press and hold the app icon and choose Change sign-in type.</p>
  </div>
  <div id="help">
    <span id="why"></span><br>
    <a class="btn" id="go" href="#">Open INOVEX Task Manager</a>
    <p class="small"><a href="./?choose=1" id="switch">Change sign-in type</a></p>
  </div>
</div>
<script src="./config.js"></script>
<script>
(function () {
  // The portal opens directly in this window (no frame), so Google sign-in works as in the browser.
  // Staff use the company address, so Google picks the INOVEX account even when another Google account is the default.
  var C = window.TM_CONFIG, q = new URLSearchParams(location.search);
  var get = function (k, d) { try { var v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } };
  var set = function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  var ar = (get('inovex-tm:lang', null) || (/^ar/i.test(navigator.language) ? 'ar' : 'en')) === 'ar';
  var T = ar ? { msg: 'جارٍ فتح مدير مهام إينوفكس…', q: 'كيف تسجّل الدخول؟', staff: 'موظف إينوفكس (@inovex-group.com)', guest: 'مدعو — أسجّل الدخول برمز البريد', later: 'يتذكر التطبيق اختيارك. لتغييره اضغط مطولاً على أيقونة التطبيق واختر «تغيير طريقة تسجيل الدخول».', go: 'افتح مدير مهام إينوفكس', sw: 'تغيير طريقة تسجيل الدخول', off: 'لا يوجد اتصال بالإنترنت. اتصل ثم اضغط الزر.', slow: 'إذا لم تفتح الصفحة، اضغط الزر.' }
    : { off: 'You are offline. Connect to the internet, then tap the button.', slow: 'If nothing opens, tap the button.' };
  if (ar) { document.documentElement.lang = 'ar'; document.documentElement.dir = 'rtl';
    ['msg', 'q', 'staff', 'guest', 'later', 'go'].forEach(function (id) { document.getElementById(id).textContent = T[id]; }); document.getElementById('switch').textContent = T.sw; }
  var $ = function (id) { return document.getElementById(id); };
  function urlFor(mode) { return mode === 'guest' ? C.appUrl : C.staffUrl + '?via=staff'; }
  function launch(mode) {
    $('choose').hidden = true; $('wait').hidden = false; var url = urlFor(mode); $('go').href = url;
    if (navigator.onLine === false) { help(T.off); window.addEventListener('online', function () { location.replace(url); }); return; }
    location.replace(url); setTimeout(function () { help(T.slow); }, 6000);
  }
  function help(text) { $('why').textContent = text; $('help').style.display = 'block'; }
  var mode = q.get('choose') ? null : get('inovex-tm:mode', null);
  if (mode === 'staff' || mode === 'guest') launch(mode);
  else { $('wait').hidden = true; $('choose').hidden = false; }
  $('staff').onclick = function () { set('inovex-tm:mode', 'staff'); launch('staff'); };
  $('guest').onclick = function () { set('inovex-tm:mode', 'guest'); launch('guest'); };
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(function () {});
})();
</script>
</body>
</html>
